upstream backend {
    server backend:8000;
}

# HTTP: serve LE webroot challenges, redirect everything else to HTTPS
server {
    listen 80;
    server_name radugaulybok-dent.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: full stack
server {
    listen 443 ssl http2;
    server_name radugaulybok-dent.ru;

    ssl_certificate     /etc/letsencrypt/live/radugaulybok-dent.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radugaulybok-dent.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 15M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Django static (admin, jazzmin, DRF) — ^~ выбирает префикс ДО regex-локаций.
    # Без этого regex `\.(js|css|...)$` ниже перехватывал бы /static/admin/css/*.css
    # и пытался отдать из SPA-каталога, ломая Django-админку.
    location ^~ /static/ {
        alias /static/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # User-uploaded media (instruction.pdf, фото анализов)
    location ^~ /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Django REST API
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Правовые документы (соглашения, согласия): рендерит Django — отдаёт PDF redirect
    # или HTML страницу из админских данных. ^~ выбирается ДО regex-локаций ниже,
    # иначе .html-regex перехватил бы и попытался отдать из SPA-каталога.
    location ^~ /docs/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA static assets (cache by content hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Frontend SPA fallback
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
